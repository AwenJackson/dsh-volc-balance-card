# dsh-volc-balance-card bundle patch：把「火山引擎余额 + 方舟套餐」卡片
# 挂进 dsh profile。安装后由 profile 层自动应用。
#
# 目录（CATALOG）会自动发现已配置凭证的供应商：本包只关心火山引擎，
# 所以只要 .credentials.yaml 里存在 VOLC_ACCESS_KEY / VOLC_SECRET_KEY，
# 就会自动出现三行：
#   volcengine-balance  账户充值余额（Billing QueryBalanceAcct）
#   volcengine-agent    方舟 Agent Plan 套餐窗口
#   volcengine-coding   方舟 Coding Plan 套餐窗口
#
# Agent Plan 行默认也显示：账号没订阅时它是一条中性的「未开通」提示，
# 不是报错；订阅后同一行自动变成 5h / 周 / 月三条用量窗口。
#
# 想只留其中一行，用 hide: [volcengine-agent, volcengine-coding]
# 或在卡片设置面板（齿轮 → 显示）里勾选，前端开关优先。

- insert:
    - id: volc-balance-card
      name: 'dsh-volc-balance-card'
      config:
        refreshMs: 60000
        providers: []
        catalog:
          volcengine-balance:
            balanceTiers:
              critical: 10
              warn: 20
              healthy: 50
